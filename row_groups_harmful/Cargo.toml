[workspace]
members = [
    "experiments/evaluate_filesystem",
    "experiments/row_group_memory_test",
    "experiments/row_group_io_parallelism",
    "utilities"
]
resolver = "2"

[workspace.dependencies]
# Common dependencies that experiments can share
async-trait = "0.1.77"
bytes = "1.9.0"
clap = { version = "4.4.12", features = ["derive"] }
env_logger = "0.11.5"
flume = "0.11.1"
futures = "0.3.31"
glob = "0.3.1"
indicatif = "0.17.9"
libc = "0.2.169"
num_cpus = "1.16.0"
object_store = { version = "0.12.3", features = ["aws"] }
once_cell = "1.19.0"
rand = "0.8.5"
rayon = "1.10.0"
tempfile = "3.15.0"
tokio = { version = "1.42.0", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "io-std",
] }
tracing = "0.1.41"
tracing-chrome = "0.7.2"
tracing-core = "0.1.33"
tracing-subscriber = "0.3.19"
url = "2.5.0"

# Arrow / Parquet dependencies
arrow-array = "55"
arrow-buffer = "55"
arrow-schema = "55"
arrow-select = "55"
parquet = { version = "55", features = ["async"] }

# DataFusion dependencies
datafusion = "49"
datafusion-execution = "49"
datafusion-physical-plan = "49"
datafusion-physical-expr = "49"

# Lance dependencies
lance-file = "0.36"
lance-io = "0.36"
